# Deploys gm-bmd to the Allfather prod environment on push to the
# `prod` branch. Registry login: user = slug, password = the action API key.
name: deploy-prod

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.act.gymnation.com
          username: gm-bmd
          password: ${{ secrets.AF_API_KEY }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: registry.act.gymnation.com/gm-bmd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out
        run: |
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.AF_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${{ github.sha }}\"}" \
            https://allfather.prod.gymnation.com/api/deploy)
          body=$(echo "$resp" | sed '$d'); code=$(echo "$resp" | tail -1)
          echo "$body"
          [ "$code" = "200" ] || { echo "deploy failed ($code)"; exit 1; }
          echo "live at https://gm-bmd.act.gymnation.com"
